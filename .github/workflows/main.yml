name: Surveillance et Réveil Multi-Comptes (Fix SSH)

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  check-and-wakeup-all:
    runs-on: ubuntu-latest
    steps:
      - name: Boucle sur les 2 comptes GitHub
        env:
          T1: ${{ secrets.TOKEN_1 }}
          T2: ${{ secrets.TOKEN_2 }}
        run: |
          TOKENS=("$T1" "$T2")
          COMPTE_NUM=1

          for CURRENT_TOKEN in "${TOKENS[@]}"; do
            echo "--------------------------------------------------"
            echo "Analyse du Compte N°$COMPTE_NUM..."

            if [ -z "$CURRENT_TOKEN" ] || [ "$CURRENT_TOKEN" = "null" ]; then
              echo "Token N°$COMPTE_NUM non configuré. Passage au suivant."
              COMPTE_NUM=$((COMPTE_NUM + 1))
              continue
            fi

            export GH_TOKEN="$CURRENT_TOKEN"

            # Récupération sécurisée des infos du codespace
            INFO=$(gh codespace list --json name,state --jq '.[0]' 2>/dev/null)

            if [ -z "$INFO" ] || [ "$INFO" = "null" ]; then
              echo "Aucun Codespace trouvé sur le compte N°$COMPTE_NUM."
            else
              NAME=$(echo "$INFO" | jq -r '.name')
              STATE=$(echo "$INFO" | jq -r '.state')

              echo "Codespace détecté : $NAME (État actuel : $STATE)"

              if [ "$STATE" = "Shutdown" ]; then
                echo "-> Statut 'Shutdown' détecté. Réveil via l'API GitHub..."
                
                # Utilisation de l'API de démarrage au lieu du SSH pour éviter le plantage
                gh api -X POST "/user/codespaces/$NAME/start" > /dev/null 2>&1
                
                echo "-> L'ordre de démarrage a été accepté par GitHub !"
              else
                echo "-> Le Codespace est déjà en marche ($STATE). Pas besoin de le réveiller."
              fi
            fi

            COMPTE_NUM=$((COMPTE_NUM + 1))
          done
          echo "--------------------------------------------------"
          echo "Vérification terminée avec succès !"
